services:
  waha-multi-session:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: waha-multi-session
    restart: unless-stopped
    
    dns:
      - 1.1.1.1
      - 8.8.8.8

    ports:
      - '127.0.0.1:3000:3000/tcp'

    volumes:
      # Session storage
      - './sessions:/app/.sessions'
      # Media storage  
      - './media:/app/.media'

    environment:
      # Force WAHA CORE version with our multi-session implementation
      - WAHA_VERSION=CORE
      # Engine configuration
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      # Debug settings
      - WAHA_DEBUG_MODE=true
      - WHATSAPP_PRINT_QR=true
      # API settings
      - WHATSAPP_API_HOSTNAME=localhost
      - WHATSAPP_API_PORT=3000
      # Media settings
      - WHATSAPP_DOWNLOAD_MEDIA=true
      - WHATSAPP_FILES_MIMETYPES=image/jpeg,image/png,image/gif,image/webp,video/mp4,audio/mpeg,audio/ogg
      # Session settings
      - WHATSAPP_START_SESSION=""
      # Security (optional for testing)
      - WAHA_API_KEY=""
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    # Resource limits for testing
    mem_limit: 2g
    cpus: '2.0'

volumes:
  sessions_data:
  media_data: